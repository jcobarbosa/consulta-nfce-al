<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minhas notas</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px 16px;font:16px system-ui,sans-serif;background:#f3f4f6;color:#17212b}main{max-width:850px;margin:auto}h1{font-size:1.6rem}h2{font-size:1.15rem}section{margin:24px 0;padding:18px;background:white;border-radius:12px}button,input{font:inherit;border-radius:8px;min-height:46px}button{border:0;padding:10px 16px;background:#176b46;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:default}.sec{background:#465363}input{border:1px solid #abb6bf;padding:10px;flex:1;min-width:160px}.linha{display:flex;gap:10px;flex-wrap:wrap}video{width:100%;max-height:60vh;background:#111;border-radius:10px;margin-top:14px} [hidden]{display:none!important}.tabela{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.95rem}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #ddd}td:not(:first-child),th:not(:first-child){white-space:nowrap;text-align:right}small{display:block;color:#59636e;overflow-wrap:anywhere;font-size:.72rem;margin-top:5px}p[role=status]{min-height:24px}details{margin-top:8px}summary{cursor:pointer}#buscaStatus{color:#465363}
</style><script defer src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script></head>
<body><main><h1>Minhas notas</h1>
<section><h2>Pesquisar itens</h2><form id="pesquisa" class="linha"><input id="termo" type="search" placeholder="Parte da descrição do produto" aria-label="Descrição do produto" maxlength="150"><button id="buscar">Buscar</button></form><p id="buscaStatus" role="status" aria-live="polite">Informe uma descrição ou busque todos os itens.</p><div id="lista" class="tabela" hidden><table><thead><tr><th>Item</th><th>Vl. unit.</th><th>Vl. total</th><th>Inclusão</th></tr></thead><tbody id="itens"></tbody></table></div><div class="linha"><button id="anterior" class="sec" hidden>Anterior</button><button id="proxima" class="sec" hidden>Próxima</button></div></section>
<section><h2>Adicionar nota</h2><p>Leia o QR Code da nota fiscal.</p><div class="linha"><button id="abrir">Ler QR Code</button><button id="parar" class="sec" disabled>Parar</button><button id="repetir" class="sec" hidden>Tentar novamente</button></div><p id="status" role="status" aria-live="polite">Aguardando leitura.</p><video id="video" autoplay muted playsinline hidden></video><canvas id="canvas" hidden></canvas></section>
</main><script>
'use strict';
const el=id=>document.getElementById(id),video=el('video'),canvas=el('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});
let stream=null,geracao=0,timer=null,importando=false,chaveAtual=null,paginaAtual=1,termoAtual='',buscaId=0,pesquisou=false;
const dinheiro=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
function chaveValida(c){if(!/^\d{44}$/.test(c)||/^(\d)\1{43}$/.test(c))return false;let soma=0,peso=2;for(let i=42;i>=0;i--){soma+=Number(c[i])*peso;peso=peso===9?2:peso+1}let r=soma%11;return Number(c[43])===(r<2?0:11-r)}
function extrair(texto){const candidatos=[texto.trim()];try{const p=new URL(texto.trim()).searchParams.get('p');if(p)candidatos.unshift(p.split('|')[0].trim())}catch{}for(const m of texto.matchAll(/(?:^|\D)(\d{44})(?!\d)/g))candidatos.push(m[1]);return candidatos.find(chaveValida)||null}
async function api(acao,params={},body=null){const url=new URL('./api.php',location.href);url.searchParams.set('acao',acao);for(const[k,v]of Object.entries(params))url.searchParams.set(k,v);const controller=new AbortController(),limite=setTimeout(()=>controller.abort(),75000);try{const r=await fetch(url,{method:body?'POST':'GET',credentials:'same-origin',cache:'no-store',headers:body?{'Accept':'application/json','Content-Type':'application/json'}:{'Accept':'application/json'},body:body?JSON.stringify(body):undefined,signal:controller.signal});const texto=await r.text();let dados;try{dados=JSON.parse(texto)}catch{throw Error('A hospedagem não retornou JSON. Recarregue a página para renovar a sessão.')}if(!r.ok||dados.erro)throw Error(dados.erro||`HTTP ${r.status}`);return dados}catch(e){if(e.name==='AbortError')throw Error('Tempo de espera excedido. Você pode tentar novamente; itens já gravados não serão duplicados.');throw e}finally{clearTimeout(limite)}}
function pararCamera(){geracao++;clearTimeout(timer);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.pause();video.srcObject=null;video.hidden=true;el('abrir').disabled=importando;el('parar').disabled=true}
function celula(linha,texto){const td=document.createElement('td');td.textContent=texto;linha.append(td);return td}
async function pesquisar(pagina=1,termo=el('termo').value.trim()){
 const id=++buscaId;el('buscaStatus').textContent='Buscando…';el('buscar').disabled=true;
 try{const dados=await api('buscar',{termo,pagina});if(id!==buscaId)return;
 paginaAtual=dados.pagina;termoAtual=termo;pesquisou=true;const tbody=el('itens');tbody.replaceChildren();
 for(const item of dados.itens){const tr=document.createElement('tr');const td=celula(tr,item.item);const details=document.createElement('details'),summary=document.createElement('summary'),small=document.createElement('small');summary.textContent='Nota';small.textContent=item.chaveNfce;details.append(summary,small);td.append(details);celula(tr,dinheiro.format(Number(item.valor_unitario)));celula(tr,dinheiro.format(Number(item.valor_total)));celula(tr,item.dataInclusao);tbody.append(tr)}
 el('lista').hidden=!dados.itens.length;el('buscaStatus').textContent=dados.total?`${dados.total} item(ns). Página ${dados.pagina} de ${Math.ceil(dados.total/dados.porPagina)}.`:'Nenhum item encontrado.';el('anterior').hidden=paginaAtual<=1;el('proxima').hidden=paginaAtual*dados.porPagina>=dados.total;
 }catch(e){if(id===buscaId){el('lista').hidden=true;el('anterior').hidden=true;el('proxima').hidden=true;el('buscaStatus').textContent=e.message}}finally{if(id===buscaId)el('buscar').disabled=false}
}
async function importar(chave){if(importando)return;importando=true;el('abrir').disabled=true;el('repetir').hidden=true;el('status').textContent='Consultando a SEFAZ…';try{await api('importar',{}, {chaveNfce:chave});el('status').textContent='Nota integrada com sucesso.';if(pesquisou)await pesquisar(1,termoAtual)}catch(e){el('status').textContent='Falha na integração: '+e.message;el('repetir').hidden=false}finally{importando=false;el('abrir').disabled=false}}
function quadro(id){if(id!==geracao||!stream)return;try{if(video.readyState>=2&&video.videoWidth){const escala=Math.min(1,960/video.videoWidth);canvas.width=Math.round(video.videoWidth*escala);canvas.height=Math.round(video.videoHeight*escala);ctx.drawImage(video,0,0,canvas.width,canvas.height);const img=ctx.getImageData(0,0,canvas.width,canvas.height),qr=window.jsQR(img.data,img.width,img.height,{inversionAttempts:'attemptBoth'});if(qr&&qr.data){pararCamera();chaveAtual=extrair(qr.data);if(!chaveAtual){el('status').textContent='QR Code sem chave válida de nota fiscal.';return}importar(chaveAtual);return}}timer=setTimeout(()=>quadro(id),120)}catch(e){pararCamera();el('status').textContent='Falha na leitura da câmera.';console.error(e)}}
el('abrir').onclick=async()=>{if(importando)return;if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia){el('status').textContent='Abra a página por HTTPS em um navegador com acesso à câmera.';return}if(typeof window.jsQR!=='function'||!ctx){el('status').textContent='Leitor indisponível. Recarregue a página.';return}el('abrir').disabled=true;el('parar').disabled=false;el('repetir').hidden=true;chaveAtual=null;const id=++geracao;el('status').textContent='Solicitando acesso à câmera…';try{const nova=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});if(id!==geracao){nova.getTracks().forEach(t=>t.stop());return}stream=nova;video.srcObject=stream;video.hidden=false;await video.play();if(id!==geracao)return;el('status').textContent='Aponte para o QR Code.';quadro(id)}catch(e){if(id!==geracao)return;pararCamera();el('status').textContent=e.name==='NotAllowedError'?'Permita o acesso à câmera nas configurações do site.':'Não foi possível abrir a câmera.'}};
el('parar').onclick=()=>{pararCamera();el('status').textContent='Câmera desligada.'};el('repetir').onclick=()=>{if(chaveAtual)importar(chaveAtual)};el('pesquisa').onsubmit=e=>{e.preventDefault();pesquisar()};el('anterior').onclick=()=>pesquisar(paginaAtual-1,termoAtual);el('proxima').onclick=()=>pesquisar(paginaAtual+1,termoAtual);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&!el('parar').disabled){pararCamera();el('status').textContent='Câmera desligada. Toque em Ler QR Code para continuar.'}});window.addEventListener('pagehide',pararCamera);
</script></body></html>
